<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gia Đình Hà Trang Linh Vy</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #f43f5e;
            --accent-gradient: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header & Slideshow Banner */
        header {
            position: relative;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.4);
        }

        .slide.active {
            opacity: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            padding: 20px;
            animation: fadeInDown 1s ease;
        }

        .header-content h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #fda4af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-content p {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Admin Control Bar */
        .admin-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
        }

        /* Admin Upload Panel */
        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 35px;
            backdrop-filter: blur(10px);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #fb7185;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-form input, .upload-form select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
        }

        /* Loading Spinner */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 10px;
            color: #fb7185;
            font-size: 0.9rem;
        }

        /* Timeline Layout */
        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent-color), rgba(255,255,255,0.1));
        }

        .year-section {
            margin-bottom: 40px;
            position: relative;
        }

        .year-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fb7185;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .year-title::before {
            content: '';
            position: absolute;
            left: -26px;
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .photo-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            height: 200px;
            transition: transform 0.2s ease;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .photo-title {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-tags-preview {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag-badge {
            font-size: 0.65rem;
            background: rgba(244, 63, 94, 0.3);
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid rgba(244, 63, 94, 0.5);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .admin-mode .delete-btn {
            display: flex;
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 15px;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .lightbox-img-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-img-wrapper img {
            width: 100%;
            height: 100%;
            max-height: 50vh;
            object-fit: contain;
        }

        .lightbox-sidebar {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lightbox-sidebar h3 {
            font-size: 1.2rem;
            color: #fff;
        }

        .sticker-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .sticker-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .sticker-chip {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .sticker-chip.selected {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .custom-note-input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            resize: none;
            outline: none;
            font-size: 0.9rem;
            height: 70px;
        }

        .close-lightbox {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 1010;
        }

        /* Login Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #111827;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .modal-box h3 { margin-bottom: 15px; font-size: 1.2rem; }
        .modal-box input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (min-width: 768px) {
            header { height: 70vh; }
            .header-content h1 { font-size: 3.2rem; }
            .upload-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: center; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
            .photo-card { height: 300px; }
            .lightbox { padding: 40px; align-items: center; justify-content: center; }
            .lightbox-container { max-width: 900px; flex-direction: row; }
            .lightbox-img-wrapper { max-height: 75vh; min-height: 450px; flex: 2; }
            .lightbox-img-wrapper img { max-height: 75vh; }
            .lightbox-sidebar { flex: 1; border-left: 1px solid var(--border-color); }
            .close-lightbox { top: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header & Banner Slideshow -->
    <header>
        <div class="slideshow" id="slideshow">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1000&q=80')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=1000&q=80')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1000&q=80')"></div>
        </div>
        
        <div class="admin-bar">
            <button class="btn" id="loginBtn" onclick="openLoginModal()"><i class="fa-solid fa-lock"></i> Admin</button>
            <button class="btn btn-primary" id="logoutBtn" style="display:none;" onclick="logoutAdmin()"><i class="fa-solid fa-lock-open"></i> Thoát</button>
        </div>

        <div class="header-content">
            <h1>Gia Đình Hà Trang Linh Vy</h1>
            <p>Nơi lưu giữ những khoảnh khắc yêu thương</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">

        <!-- Admin Upload Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> Thêm Kỷ Niệm Mới</h3>
            <div class="upload-form">
                <input type="text" id="photoTitleInput" placeholder="Tên bức ảnh / Sự kiện...">
                <select id="photoYearInput">
                    <option value="2026">Năm 2026</option>
                    <option value="2025">Năm 2025</option>
                    <option value="2024">Năm 2024</option>
                </select>
                <input type="file" id="photoFileInput" accept="image/*">
                <button class="btn btn-primary" style="justify-content:center;" onclick="uploadPhoto()"><i class="fa-solid fa-plus"></i> Đăng ảnh lên</button>
            </div>
            <div class="loading-overlay" id="loadingText">Đang tải ảnh lên đám mây, vui lòng đợi một chút...</div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline" id="timelineContainer"></div>
    </div>

    <!-- Lightbox Xem Ảnh & Thêm Nhãn Dán -->
    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
        <div class="lightbox-container">
            <div class="lightbox-img-wrapper">
                <img id="lightboxImg" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <div>
                    <h3 id="lightboxTitle">Tiêu đề ảnh</h3>
                    <div class="sticker-section">
                        <label>Nhãn dán:</label>
                        <div class="sticker-options">
                            <span class="sticker-chip" onclick="toggleSticker(this)">#YêuThương</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#HạnhPhúc</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#KỷNiệmĐẹp</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#DuLịch</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#TếtVui</span>
                        </div>
                        <label>Ghi chú:</label>
                        <textarea class="custom-note-input" id="lightboxNote" placeholder="Viết ghi chú..."></textarea>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" onclick="downloadCurrentPhoto()"><i class="fa-solid fa-download"></i> Tải ảnh xuống điện thoại</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3>Đăng Nhập Quản Trị</h3>
            <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:12px;">Mật khẩu mặc định: <b>123456</b></p>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu...">
            <button class="btn btn-primary" style="width:100%; justify-content:center; padding:10px;" onclick="checkLogin()">Xác Nhận</button>
            <button class="btn" style="width:100%; justify-content:center; margin-top:8px; padding:10px;" onclick="closeLoginModal()">Hủy</button>
        </div>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase thực tế của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDxR0WB64Cpk_wqvuMg1IQWlK13nyXiUQQ",
            authDomain: "giadinh-trang.firebaseapp.com",
            databaseURL: "https://giadinh-trang-default-rtdb.firebaseio.com",
            projectId: "giadinh-trang",
            storageBucket: "giadinh-trang.firebasestorage.app",
            messagingSenderId: "789981574238",
            appId: "1:789981574238:web:916d71874fee4dd28030cf",
            measurementId: "G-RX3KGX8775"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let galleryData = [];
        let isAdmin = false;
        let currentActivePhotoId = null;

        // Slideshow Banner
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 4000);

        // Lấy dữ liệu realtime từ Firebase Firestore
        function loadGalleryFromFirebase() {
            onSnapshot(collection(db, "photos"), (snapshot) => {
                galleryData = [];
                snapshot.forEach((docSnap) => {
                    galleryData.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGallery();
            }, (error) => {
                console.log("Lỗi kết nối Firebase: ", error);
            });
        }

        // Render Timeline
        window.renderGallery = function() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            if (galleryData.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px;">Chưa có kỷ niệm nào. Hãy đăng nhập Admin để thêm ảnh đầu tiên!</p>`;
                return;
            }

            const years = [...new Set(galleryData.map(item => item.year))].sort((a,b) => b - a);

            years.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';

                const yearTitle = document.createElement('h2');
                yearTitle.className = 'year-title';
                yearTitle.innerHTML = `<i class="fa-regular fa-calendar-days"></i> Năm ${year}`;
                yearSection.appendChild(yearTitle);

                const grid = document.createElement('div');
                grid.className = 'photo-grid';

                const photosInYear = galleryData.filter(item => item.year === year);
                photosInYear.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = `photo-card ${isAdmin ? 'admin-mode' : ''}`;
                    card.innerHTML = `
                        <img src="${photo.url}" alt="${photo.title}">
                        <button class="delete-btn" onclick="deletePhoto(event, '${photo.id}')"><i class="fa-solid fa-trash"></i></button>
                        <div class="photo-overlay">
                            <div class="photo-title">${photo.title}</div>
                            <div class="photo-tags-preview">
                                ${(photo.tags || []).map(t => `<span class="tag-badge">${t}</span>`).join('')}
                            </div>
                        </div>
                    `;
                    card.onclick = (e) => {
                        if (!e.target.closest('.delete-btn')) {
                            openLightbox(photo.id);
                        }
                    };
                    grid.appendChild(card);
                });

                yearSection.appendChild(grid);
                container.appendChild(yearSection);
            });
        }

        // Admin Auth
        window.openLoginModal = function() { document.getElementById('loginModal').classList.add('active'); }
        window.closeLoginModal = function() { document.getElementById('loginModal').classList.remove('active'); }
        window.checkLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === '123456') {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                closeLoginModal();
                renderGallery();
            } else {
                alert('Mật khẩu không đúng!');
            }
        }
        window.logoutAdmin = function() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginBtn').style.display = 'inline-flex';
            document.getElementById('logoutBtn').style.display = 'none';
            renderGallery();
        }

        // Upload Photo lên Firebase Firestore
        window.uploadPhoto = async function() {
            const title = document.getElementById('photoTitleInput').value;
            const year = document.getElementById('photoYearInput').value;
            const fileInput = document.getElementById('photoFileInput');

            if (!title || fileInput.files.length === 0) {
                alert('Vui lòng nhập tên ảnh và chọn ảnh từ thiết bị!');
                return;
            }

            document.getElementById('loadingText').style.display = 'block';

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const newPhoto = {
                        year: year,
                        title: title,
                        url: e.target.result,
                        tags: ['#GiaĐình'],
                        note: 'Khoảnh khắc mới gia đình.',
                        createdAt: Date.now()
                    };
                    await addDoc(collection(db, "photos"), newPhoto);
                    document.getElementById('photoTitleInput').value = '';
                    document.getElementById('photoFileInput').value = '';
                    alert('Đăng ảnh lên đám mây thành công!');
                } catch (err) {
                    alert('Lỗi khi đăng ảnh: ' + err.message);
                } finally {
                    document.getElementById('loadingText').style.display = 'none';
                }
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        // Delete Photo trên Firebase
        window.deletePhoto = async function(event, id) {
            event.stopPropagation();
            if (confirm('Bạn có chắc chắn muốn xóa bức ảnh này không?')) {
                try {
                    await deleteDoc(doc(db, "photos", id));
                    alert('Đã xóa ảnh thành công!');
                } catch (err) {
                    alert('Không thể xóa ảnh: ' + err.message);
                }
            }
        }

        // Lightbox & Sticker Customization
        window.openLightbox = function(id) {
            currentActivePhotoId = id;
            const photo = galleryData.find(p => p.id === id);
            if (!photo) return;

            document.getElementById('lightboxImg').src = photo.url;
            document.getElementById('lightboxTitle').innerText = photo.title;
            document.getElementById('lightboxNote').value = photo.note || '';

            const chips = document.querySelectorAll('.sticker-chip');
            chips.forEach(chip => {
                if ((photo.tags || []).includes(chip.innerText)) {
                    chip.classList.add('selected');
                } else {
                    chip.classList.remove('selected');
                }
            });

            document.getElementById('lightbox').classList.add('active');
        }

        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.remove('active');
        }

        window.toggleSticker = async function(element) {
            element.classList.toggle('selected');
            await updatePhotoMetadata();
        }

        let debounceTimer;
        document.getElementById('lightboxNote').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePhotoMetadata, 500);
        });

        async function updatePhotoMetadata() {
            if (!currentActivePhotoId) return;
            const photo = galleryData.find(p => p.id === currentActivePhotoId);
            if (!photo) return;

            const note = document.getElementById('lightboxNote').value;
            const selectedChips = document.querySelectorAll('.sticker-chip.selected');
            const tags = Array.from(selectedChips).map(c => c.innerText);

            try {
                const photoRef = doc(db, "photos", currentActivePhotoId);
                await updateDoc(photoRef, { note: note, tags: tags });
            } catch (err) {
                console.log("Cập nhật ghi chú thất bại.");
            }
        }

        // Tải ảnh xuống
        window.downloadCurrentPhoto = function() {
            const photo = galleryData.find(p => p.id === currentActivePhotoId);
            if (!photo) return;

            const a = document.createElement('a');
            a.href = photo.url;
            a.download = `${photo.title}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Khởi chạy tải dữ liệu
        loadGalleryFromFirebase();
    </script>
</body>
</html>
