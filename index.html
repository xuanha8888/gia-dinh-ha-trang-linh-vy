<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Đình Hà Trang Linh Vy</title>
    <!-- Google Fonts & FontAwesome cho Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #f43f5e;
            --accent-gradient: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header & Slideshow Banner */
        header {
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.4);
        }

        .slide.active {
            opacity: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            padding: 20px;
            animation: fadeInDown 1s ease;
        }

        .header-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #fda4af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Admin Control Bar */
        .admin-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* Admin Upload Section (Hidden by default) */
        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h3 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #fb7185;
        }

        .upload-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: center;
        }

        .upload-form input, .upload-form select {
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            outline: none;
        }

        /* Timeline Layout */
        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent-color), rgba(255,255,255,0.1));
        }

        .timeline-year-section {
            margin-bottom: 50px;
            position: relative;
        }

        .year-title {
            font-size: 2rem;
            font-weight: 600;
            color: #fb7185;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .year-title::before {
            content: '';
            position: absolute;
            left: -35px;
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .photo-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            height: 320px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            border-color: rgba(244, 63, 94, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .photo-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .photo-tags-preview {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tag-badge {
            font-size: 0.75rem;
            background: rgba(244, 63, 94, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(244, 63, 94, 0.5);
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(220, 38, 38, 0.8);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 5;
        }

        .admin-mode .delete-btn {
            display: flex;
        }

        .delete-btn:hover {
            background: rgb(185, 28, 28);
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            max-width: 1100px;
            width: 100%;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        .lightbox-img-wrapper {
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }

        .lightbox-img-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        .lightbox-sidebar {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid var(--border-color);
        }

        .lightbox-sidebar h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .sticker-section {
            margin: 20px 0;
        }

        .sticker-section label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .sticker-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .sticker-chip {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sticker-chip:hover, .sticker-chip.selected {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .custom-note-input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            resize: none;
            outline: none;
        }

        .lightbox-actions {
            display: flex;
            gap: 10px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 1010;
            transition: background 0.2s;
        }

        .close-lightbox:hover {
            background: var(--accent-color);
        }

        /* Login Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #111827;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .modal-box h3 { margin-bottom: 20px; }
        .modal-box input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .lightbox-container { grid-template-columns: 1fr; }
            .header-content h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Header & Banner Slideshow -->
    <header>
        <div class="slideshow" id="slideshow">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1920&q=80')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=1920&q=80')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1920&q=80')"></div>
        </div>
        
        <div class="admin-bar">
            <button class="btn" id="loginBtn" onclick="openLoginModal()"><i class="fa-solid fa-lock"></i> Đăng nhập Admin</button>
            <button class="btn btn-primary" id="logoutBtn" style="display:none;" onclick="logoutAdmin()"><i class="fa-solid fa-lock-open"></i> Thoát Admin</button>
        </div>

        <div class="header-content">
            <h1>Gia Đình Hà Trang Linh Vy</h1>
            <p>Nơi lưu giữ những khoảnh khắc yêu thương theo năm tháng</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">

        <!-- Admin Upload Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> Thêm Kỷ Niệm Mới (Chỉ Admin)</h3>
            <div class="upload-form">
                <input type="text" id="photoTitleInput" placeholder="Tên bức ảnh / Sự kiện...">
                <select id="photoYearInput">
                    <option value="2026">Năm 2026</option>
                    <option value="2025">Năm 2025</option>
                    <option value="2024">Năm 2024</option>
                </select>
                <input type="file" id="photoFileInput" accept="image/*">
                <button class="btn btn-primary" onclick="uploadPhoto()"><i class="fa-solid fa-plus"></i> Đăng ảnh</button>
            </div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline" id="timelineContainer">
            <!-- Các năm sẽ được render tự động bằng JavaScript -->
        </div>
    </div>

    <!-- Lightbox Xem Ảnh & Thêm Nhãn Dán -->
    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
        <div class="lightbox-container">
            <div class="lightbox-img-wrapper">
                <img id="lightboxImg" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <div>
                    <h3 id="lightboxTitle">Tiêu đề ảnh</h3>
                    <div class="sticker-section">
                        <label>Chọn nhãn dán (Sticker):</label>
                        <div class="sticker-options">
                            <span class="sticker-chip" onclick="toggleSticker(this)">#YêuThương</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#HạnhPhúc</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#KỷNiệmĐẹp</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#DuLịch</span>
                            <span class="sticker-chip" onclick="toggleSticker(this)">#TếtVui</span>
                        </div>
                        <label>Ghi chú cá nhân:</label>
                        <textarea class="custom-note-input" id="lightboxNote" placeholder="Viết ghi chú kỷ niệm..."></textarea>
                    </div>
                </div>
                <div class="lightbox-actions">
                    <button class="btn btn-primary" style="flex:1;" onclick="downloadCurrentPhoto()"><i class="fa-solid fa-download"></i> Tải ảnh xuống</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3>Đăng Nhập Quản Trị</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:15px;">Mật khẩu mặc định: <b>123456</b></p>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu...">
            <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="checkLogin()">Xác Nhận</button>
            <button class="btn" style="width:100%; justify-content:center; margin-top:10px;" onclick="closeLoginModal()">Hủy</button>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu ban đầu
        let galleryData = [
            { id: 1, year: '2026', title: 'Chuyến du lịch Đà Nẵng đầu năm', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80', tags: ['#DuLịch', '#HạnhPhúc'], note: 'Cả nhà cùng ngắm hoàng hôn tuyệt đẹp.' },
            { id: 2, year: '2026', title: 'Bữa cơm sum họp ngày cuối tuần', url: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80', tags: ['#YêuThương'], note: 'Món ăn do chính tay mẹ nấu.' },
            { id: 3, year: '2025', title: 'Kỷ niệm ngày cưới của bố mẹ', url: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80', tags: ['#KỷNiệmĐẹp'], note: 'Kỷ niệm 10 năm gắn bó.' }
        ];

        let isAdmin = false;
        let currentActivePhotoId = null;

        // Slideshow Banner Tự Động
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 4000);

        // Render Timeline & Photos
        function renderGallery() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            // Lấy danh sách các năm và sắp xếp giảm dần
            const years = [...new Set(galleryData.map(item => item.year))].sort((a,b) => b - a);

            years.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';

                const yearTitle = document.createElement('h2');
                yearTitle.className = 'year-title';
                yearTitle.innerHTML = `<i class="fa-regular fa-calendar-days"></i> Năm ${year}`;
                yearSection.appendChild(yearTitle);

                const grid = document.createElement('div');
                grid.className = 'photo-grid';

                const photosInYear = galleryData.filter(item => item.year === year);
                photosInYear.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = `photo-card ${isAdmin ? 'admin-mode' : ''}`;
                    card.innerHTML = `
                        <img src="${photo.url}" alt="${photo.title}">
                        <button class="delete-btn" onclick="deletePhoto(event, ${photo.id})" title="Xóa ảnh"><i class="fa-solid fa-trash"></i></button>
                        <div class="photo-overlay">
                            <div class="photo-title">${photo.title}</div>
                            <div class="photo-tags-preview">
                                ${photo.tags.map(t => `<span class="tag-badge">${t}</span>`).join('')}
                            </div>
                        </div>
                    `;
                    card.onclick = (e) => {
                        if (!e.target.closest('.delete-btn')) {
                            openLightbox(photo.id);
                        }
                    };
                    grid.appendChild(card);
                });

                yearSection.appendChild(grid);
                container.appendChild(yearSection);
            });
        }

        // Admin Auth
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        function checkLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === '123456') {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                closeLoginModal();
                renderGallery();
                alert('Đăng nhập Admin thành công!');
            } else {
                alert('Mật khẩu không đúng!');
            }
        }
        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginBtn').style.display = 'inline-flex';
            document.getElementById('logoutBtn').style.display = 'none';
            renderGallery();
        }

        // Upload Photo (Admin Only)
        function uploadPhoto() {
            const title = document.getElementById('photoTitleInput').value;
            const year = document.getElementById('photoYearInput').value;
            const fileInput = document.getElementById('photoFileInput');

            if (!title || fileInput.files.length === 0) {
                alert('Vui lòng nhập tên ảnh và chọn file ảnh!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newPhoto = {
                    id: Date.now(),
                    year: year,
                    title: title,
                    url: e.target.result,
                    tags: ['#GiaĐình'],
                    note: 'Khoảnh khắc mới được thêm.'
                };
                galleryData.unshift(newPhoto);
                renderGallery();
                document.getElementById('photoTitleInput').value = '';
                document.getElementById('photoFileInput').value = '';
                alert('Tải ảnh lên thành công!');
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        // Delete Photo
        function deletePhoto(event, id) {
            event.stopPropagation();
            if (confirm('Bạn có chắc chắn muốn xóa bức ảnh này không?')) {
                galleryData = galleryData.filter(p => p.id !== id);
                renderGallery();
            }
        }

        // Lightbox & Sticker Customization
        function openLightbox(id) {
            currentActivePhotoId = id;
            const photo = galleryData.find(p => p.id === id);
            if (!photo) return;

            document.getElementById('lightboxImg').src = photo.url;
            document.getElementById('lightboxTitle').innerText = photo.title;
            document.getElementById('lightboxNote').value = photo.note || '';

            // Reset và gán trạng thái sticker
            const chips = document.querySelectorAll('.sticker-chip');
            chips.forEach(chip => {
                if (photo.tags.includes(chip.innerText)) {
                    chip.classList.add('selected');
                } else {
                    chip.classList.remove('selected');
                }
            });

            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function toggleSticker(element) {
            element.classList.toggle('selected');
            updatePhotoMetadata();
        }

        // Lưu cập nhật ghi chú và nhãn dán real-time
        document.getElementById('lightboxNote').addEventListener('input', () => {
            updatePhotoMetadata();
        });

        function updatePhotoMetadata() {
            const photo = galleryData.find(p => p.id === currentActivePhotoId);
            if (!photo) return;

            // Cập nhật note
            photo.note = document.getElementById('lightboxNote').value;

            // Cập nhật tags từ các chip được chọn
            const selectedChips = document.querySelectorAll('.sticker-chip.selected');
            photo.tags = Array.from(selectedChips).map(c => c.innerText);

            renderGallery();
        }

        // Tải ảnh xuống
        function downloadCurrentPhoto() {
            const photo = galleryData.find(p => p.id === currentActivePhotoId);
            if (!photo) return;

            const a = document.createElement('a');
            a.href = photo.url;
            a.download = `${photo.title}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Khởi chạy lần đầu
        renderGallery();
    </script>
</body>
</html>
